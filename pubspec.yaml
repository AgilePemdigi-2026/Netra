name: netra_app

description: "NETRA - Sistem Pelayanan Aksesibilitas Publik Berbasis AI untuk Disabilitas Netra di Surabaya"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend dan Database Supabase
  supabase_flutter: ^2.18.3

  # Text-to-Speech untuk Panduan dan Peringatan Suara
  flutter_tts: ^4.2.5

  # Getaran untuk Peringatan Hambatan
  vibration: ^3.2.1

  # UI dan Font
  google_fonts: ^8.2.1

  # Kamera
  camera: ^0.12.0+2

  # AI Object Detection
  ultralytics_yolo: 
    path: third_party/ultralytics_yolo

  # Lokasi dan Geocoding
  geolocator: ^14.1.2
  geocoding: ^5.0.0

  # Membuka lokasi temuan di Google Maps (halaman Admin)
  url_launcher: ^6.3.1

  # Speech Recognition
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generator Icon Aplikasi
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # Asset gambar NETRA
  assets:
    - assets/images/
    - assets/models/netra_v4.tflite

# Konfigurasi Icon NETRA
flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/icon_netra.png"

  web:
    generate: true
    image_path: "assets/images/icon_netra.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
