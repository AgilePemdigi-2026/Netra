
name: netra_app
description: "NETRA - Sistem Pelayanan Aksesibilitas Publik Berbasis AI untuk Disabilitas Netra di Surabaya"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend dan Database Supabase
  supabase_flutter: ^2.18.3

  # Text-to-Speech untuk Panduan dan Peringatan Suara
  flutter_tts: ^4.2.5

  # Getaran untuk Peringatan Hambatan
  vibration: ^3.2.1
  google_fonts: ^8.2.1
  camera: ^0.12.0+2
  ultralytics_yolo: ^0.6.16
  geolocator: ^14.1.2
  geocoding: ^5.0.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Asset gambar NETRA
  assets:
    - assets/images/
